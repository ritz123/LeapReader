[project]
name = "leapreader-backend"
version = "0.1.0"
description = "LeapReader AI backend — FastAPI sidecar for Ollama integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.50.2",
    "ollama==0.6.2",
    "pypdf>=4.0",
    "ddgs==9.14.4",
    "requests>=2.28",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.3",
    "httpx>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# All backend modules live at the root of backend/; no src/ layout needed.
include = ["*.py", "routers/*.py"]
